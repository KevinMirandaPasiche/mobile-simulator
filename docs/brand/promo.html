<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo tile</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<style>
  /* Chrome Web Store small promo tile: 440×280. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    position: relative; font-family: Inter, system-ui, sans-serif; font-optical-sizing: auto; color: #fff;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(260px 200px at 60px 20px, rgb(255 255 255 / 0.22), transparent 70%),
      linear-gradient(135deg, #ff8f5e 0%, #ff4f8b 46%, #7a5af8 100%);
  }
  .copy { position: absolute; left: 30px; top: 50%; translate: 0 -50%; width: 210px; }
  h1 { font-size: 38px; line-height: 1.02; font-weight: 760; letter-spacing: -0.04em; }
  p { margin-top: 12px; font-size: 16px; line-height: 1.3; font-weight: 560; letter-spacing: -0.01em; color: rgb(255 255 255 / 0.88); }
  .dev { position: absolute; display: block; }
  .iphone { left: 258px; top: 34px; height: 336px; filter: drop-shadow(0 18px 28px rgb(50 10 90 / 0.4)); }
</style>
</head>
<body>
  <div class="copy">
    <h1>Mobile Simulator</h1>
    <p>Every screen.<br>One click.</p>
  </div>
  <img class="dev iphone" src="devices/iphone.png" alt="">
</body>
</html>
